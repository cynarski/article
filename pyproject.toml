[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolling-fit-research-tools"
version = "0.1.0"
description = "Reusable rolling-fit aggregation and temporal availability validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=1.5"]

[project.optional-dependencies]
test = ["pytest>=7"]
research = ["scikit-learn>=1.5", "xgboost>=2", "lightgbm>=4", "catboost>=1.2", "scipy>=1.11", "joblib>=1.3", "matplotlib>=3.8", "nbformat>=5", "nbclient>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]
